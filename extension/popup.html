<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --bg:#12151f; --fg:#eef0fa; --dim:#8f97b0; --line:#232940; --acc:#8f74ff; --ok:#34d399; --bad:#fb7185; }
  @media (prefers-color-scheme: light) { :root { --bg:#ffffff; --fg:#12162a; --dim:#586079; --line:#e0e4f0; --acc:#6a4dff; --ok:#059669; --bad:#e11d48; } }
  * { box-sizing: border-box; }
  body { margin:0; width:300px; background:var(--bg); color:var(--fg); font:14px system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); }
  header img { width:30px; height:30px; border-radius:8px; }
  header b { font-size:16px; } header small { display:block; color:var(--dim); font-size:12px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; }
  .status { margin:0 16px 12px; padding:10px 12px; border-radius:10px; font-size:12px; line-height:1.4; background:color-mix(in srgb, var(--dim) 14%, transparent); }
  .status.ok { color:var(--ok); background:color-mix(in srgb, var(--ok) 14%, transparent); }
  .status.bad { color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, transparent); }
  input[type=number] { width:64px; padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--fg); }
  button { margin:0 16px 14px; width:calc(100% - 32px); padding:9px; border:0; border-radius:10px; background:linear-gradient(135deg,#7c5cff,#22d3ee); color:#fff; font-weight:700; cursor:pointer; }
  .switch { position:relative; width:42px; height:24px; } .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; border-radius:12px; background:color-mix(in srgb, var(--dim) 40%, transparent); transition:.18s; cursor:pointer; }
  .slider:before { content:""; position:absolute; left:3px; top:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.18s; }
  input:checked + .slider { background:var(--acc); } input:checked + .slider:before { transform:translateX(18px); }
</style>
</head>
<body>
  <header><img src="icons/icon48.png" alt=""><div><b>SDM</b><small>Download capture</small></div></header>
  <div class="row"><span>Capture downloads</span><label class="switch"><input id="enabled" type="checkbox"><span class="slider"></span></label></div>
  <div class="row"><span>Ignore files smaller than</span><span><input id="min" type="number" min="0" step="1"> MB</span></div>
  <div id="status" class="status">Checking connection…</div>
  <button id="test">Test connection</button>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
