[package]
name = "sdm-app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sdm"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
dirs.workspace = true
engine = { path = "../engine" }
ipc = { path = "../ipc" }
rfd.workspace = true
self-replace.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
slint = { workspace = true, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2", "unstable-winit-030"] }
tokio.workspace = true
zip.workspace = true

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
png.workspace = true
slint = { workspace = true, features = ["std", "renderer-software", "software-renderer-systemfonts", "compat-1-2"] }
tokio = { workspace = true, features = ["net", "io-util", "macros"] }
