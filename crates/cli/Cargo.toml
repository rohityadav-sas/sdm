[package]
name = "sdm-cli"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "sdm-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
engine = { path = "../engine" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
